{{ define "main" }}
{{/* Pages use most of the window. `wide: false` in the front matter keeps the
     narrower prose reading width instead. */}}
{{ if ne .Params.wide false }}
<div class="max-w-7xl mx-auto px-6 lg:px-12">
  <article class="prose prose-slate lg:prose-lg max-w-none dark:prose-invert">
{{ else }}
<div class="max-w-prose mx-auto flex justify-center px-6">
  <article class="prose prose-slate lg:prose-xl dark:prose-invert">
{{ end }}
    <h1 class="lg:text-6xl">{{ .Title }}</h1>
    {{ .Content }}
  </article>
</div>
{{ end }}
