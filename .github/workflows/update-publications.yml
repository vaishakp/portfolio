name: Update publications

on:
  schedule:
    - cron: '17 8 * * 0'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: update-publications-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install script dependencies
        run: python -m pip install --upgrade PyYAML

      - name: Update publication entries
        run: |
          python scripts/update_publications.py \
            --author "Vaishak Prasad" \
            --inspire-query 'a "Vaishak Prasad"' \
            --content-dir content/publications \
            --max-results 100

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore(publications): update from arxiv and inspire'
          title: 'Update publication entries from arXiv and INSPIRE'
          body: |
            This automated PR refreshes publication entries using:

            - arXiv author search for new public preprints
            - INSPIRE literature metadata for journal publication and DOI updates

            Please review summaries and featured status before merging.
          branch: automation/update-publications
          labels: automated-pr, content, publications
          delete-branch: true
